name = "techphase-chat"
main = "src/index.js"
compatibility_date = "2026-10-23"
preview_urls = false

# Public settings only. Do not put API keys in this file.
# Set secrets out of band:
#   npx wrangler secret put XAI_API_KEY
#   npx wrangler secret put RESEND_API_KEY
[vars]
# Chat model as of October 2026: https://docs.x.ai/developers/models
# grok-4.7 is xAI's current model for chat. Other text models on that page
# include grok-4.6, grok-4.5, grok-4.3, and grok-4.20-0309-non-reasoning.
MODEL = "grok-4.7"
# grok-4.7 always reasons; "low" is the fastest setting it accepts.
# Use an empty string to omit reasoning_effort (needed if you switch to a
# model that rejects the field).
REASONING_EFFORT = "low"
# Cap on visible reply tokens. The worker also hard-caps this at 800.
MAX_COMPLETION_TOKENS = "400"
# Inbox for lead notifications. Public var, not a secret.
LEAD_TO = "info@techphase.net"
# From header for the notification and the visitor auto-reply.
# techphase.net must be verified in Resend before mail will send.
LEAD_FROM = "TechPhase <info@techphase.net>"
